packages:
  - 'apps/*'
  - 'packages/*'

confirmModulesPurge: false

allowBuilds:
  bcrypt: true
  esbuild: true
  core-js: false

onlyBuiltDependencies:
  - bcrypt
  - esbuild

# Security floors. Raise a floor when a GitHub advisory lands; keep the
# comment so the next reader knows which advisory a floor answers.
overrides:
  kysely: ^0.28.17 # GHSA-pv5w-4p9q-p3v2 (JSON-path injection; CSN does not use the affected builder API)
  hono: '>=4.12.25' # GHSA-88fw-hqm2-52qc (CORS wildcard + credentials)
  express-rate-limit: '>=8.2.2'
  '@hono/node-server': '>=1.19.13'
  path-to-regexp: '>=8.4.0'
  undici: ^7.29.0 # GHSA-4cwx-7wf7-3272, -hm92-r4w5-c3mj, -vmh5-mc38-953g, -vxpw-j846-p89q (caret, not >=: a bare floor pulled undici 8)
  cookie: '>=0.7.0'
  devalue: '>=5.8.1' # GHSA-77vg-94rm-hx3p
  picomatch: '>=4.0.4'
  brace-expansion: '>=5.0.7' # GHSA-3jxr-9vmj-r5cp (dev-scope)
  rollup: '>=4.59.0'
  ws: '>=8.21.0' # GHSA-96hv-2xvq-fx4p
  form-data: '>=4.0.6' # GHSA-hmw2-7cc7-3qxx
  fast-uri: ^3.1.5 # GHSA-7p8r-x3mc-p8w7 + 4 earlier fast-uri advisories (caret: a bare floor pulled fast-uri 4)
  ip-address: '>=10.3.1' # GHSA-mwp4-54f8-5fhr
  nanoid: '>=3.3.18' # GHSA-2v37-7h3g-55p8, GHSA-28wg-ghj8-5hjv
  postcss: '>=8.5.18' # GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849
